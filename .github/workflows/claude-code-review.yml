name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # Copies of this repository without the secret skip instead of failing.
      HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Report missing credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret is visible to Actions; skipping the review."

      - uses: actions/checkout@v6
        if: env.HAS_CREDENTIALS == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CREDENTIALS == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the current working directory.

            Read CLAUDE.md first. Before reviewing any file, read the specs in docs/spec/ whose `scope` covers it.
            Focus, in this order:
            1. Spec violations: CPU budget and subrequest count, fail-open to the cleaned original URL,
               fix-service domains outside src/fix-services.ts, bindings beyond the free plan,
               CDN URLs in og tags or longer cache lifetimes, cleaning rules outside src/clean.ts.
            2. Bugs: wrong URL handling, missing null checks when parsing upstream HTML, crawler vs browser branches.
            3. Tests: new behavior without a test, or parsing tests that hit the network instead of fixtures.
            4. Docs: README.md and README.zh-TW.md out of sync, or CLAUDE.md not updated for changed commands or modules.

            Only report real problems. Skip style nits that TypeScript or the tests already enforce, and do not praise.
            Write comments in Traditional Chinese; keep code identifiers as they are.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for issues on specific lines.
            Use `gh pr comment` for one top-level summary. Only post GitHub comments; do not submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
