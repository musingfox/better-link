うごくイラストが投稿できる『うごイラ』をリリースしました。

『うごイラ』で投稿するイラストは1イラストごとに表示時間（フレーム時間）を設定することができます。
PNG形式、JPEG形式のイラストをうごかすことができるので、従来のアニメーションGIFよりも高画質で色彩豊かなうごくイラストを投稿できます。

それぞれのイラストに表示時間を設定することで、イラストをアニメのように表示することができます。（※画像のフォーマット（拡張子）、画像サイズをそろえる必要があります。）クリックすることで再生、一時停止も可能です。

『うごイラ』、アニメーションGIFは以下URLから投稿できます。
http://www.pixiv.net/ugoira_upload.php

あなたが創作したオリジナルのキャラ、思い描くワンシーンを『うごイラ』で動かしてみましょう。

今後ともpixivをよろしくお願いいたします。
