name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # bun.lock must stay at lockfileVersion 1; Bun 1.3 reads and writes that version.
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
